[theme]
base = "dark"
primaryColor = "#3182F6"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B24"
textColor = "#E8ECF1"
borderColor = "#262D38"
baseRadius = "0.7rem"
font = "Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2"
weight = 700

[theme.sidebar]
backgroundColor = "#11161F"

[client]
toolbarMode = "minimal"

[server]
headless = true
